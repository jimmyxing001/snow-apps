name: Sync Fork From mg-chao/snow-apps
on:
  schedule:
    # UTC 04:00 → 北京时间 12:00 每天中午自动同步
    - cron: '0 4 * * *'
  workflow_dispatch: # 支持手动点按钮触发，调试用

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/mg-chao/snow-apps.git

      - name: Fetch all upstream commits
        run: git fetch upstream

      - name: Merge upstream/main into local main
        run: |
          git checkout main
          git merge upstream/main

      - name: Push merged code back to your fork
        run: git push origin main
